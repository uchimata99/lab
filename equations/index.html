<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6e66">
<meta name="description" content="משחק משוואות בנעלמים על מאזניים, לפי רמות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מאזני המשוואות">
<title>מאזני המשוואות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one balance per screen — equation above, balance canvas beside the step list, operation tiles below */
:root{
  /* מערכת העיצוב "משחקי לימוד 9–12" — ערכה בהירה אחת */
  --surface-100:#fbf7ef; --surface-200:#f1eadb; --ink:#1f2a30; --ink-muted:#4f5b62; --line:#8a7f6c;
  --primary:#0e6e66; --on-primary:#ffffff; --accent:#e07a1f; --correct:#1e7a46; --retry:#f2b33d;
  --font:"Rubik","Heebo",system-ui,sans-serif;
  --space-2:8px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:8px; --radius-md:14px; --radius-pill:999px; --touch-min:48px; --answer-tile:72px;
  /* נגזרות */
  --hair:color-mix(in srgb,var(--line) 35%,var(--surface-200));
  --primary-soft:color-mix(in srgb,var(--primary) 12%,var(--surface-100));
  --accent-soft:color-mix(in srgb,var(--accent) 24%,var(--surface-100));
  --retry-soft:color-mix(in srgb,var(--retry) 32%,var(--surface-100));
  --correct-soft:color-mix(in srgb,var(--correct) 10%,var(--surface-100));
  --yvar:#6a4c93;
  color-scheme:light;
}
html{direction:rtl}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font);font-size:18px;line-height:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--space-6) var(--space-8)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)}
header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
h1{font-size:32px;line-height:40px;font-weight:700;margin:0;text-wrap:balance}
h1 span{color:var(--primary)}
h2{font-size:24px;line-height:32px;font-weight:700;margin:0;text-wrap:balance}
.hud{display:flex;gap:var(--space-2);align-items:center}
.stars{display:flex;align-items:center;gap:6px;min-height:var(--touch-min);padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--surface-200);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stars b{color:var(--accent);font-size:22px;display:inline-block}
.stars b.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.6) rotate(20deg)}}
.icon-btn{width:var(--touch-min);height:var(--touch-min);border-radius:50%;border:2px solid var(--line);background:var(--surface-200);font-size:20px;cursor:pointer;color:var(--ink)}
button{font-family:var(--font);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.tracks button{min-height:var(--answer-tile);border:2px solid var(--line);background:var(--surface-200);border-radius:var(--radius-md);font-size:18px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-2)}
.tracks button small{font-size:16px;font-weight:400;color:var(--ink-muted)}
.tracks button[aria-selected="true"]{border-color:var(--primary);background:var(--primary-soft)}
.levels{display:flex;gap:var(--space-2);flex-wrap:wrap}
.levels button{min-height:var(--touch-min);min-width:96px;border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:18px;font-weight:600;cursor:pointer;padding:0 var(--space-4);display:flex;align-items:center;gap:var(--space-2)}
.levels button small{font-size:16px;font-weight:500;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.levels button[aria-selected="true"]{border-color:var(--primary);background:var(--primary-soft)}
.card{background:var(--surface-200);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-6)}
@media (min-width:720px){.card{padding:var(--space-8)}}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-6);align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.stage>*{min-width:0}
.side{display:flex;flex-direction:column;gap:var(--space-4)}
canvas.cv{width:100%;height:auto;display:block;background:var(--surface-100);border:2px solid var(--hair);border-radius:var(--radius-md);user-select:none;-webkit-user-select:none}
.coach{display:flex;gap:var(--space-2);align-items:flex-start;flex-wrap:wrap}
.avatar{width:var(--touch-min);height:var(--touch-min);flex:none;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);display:grid;place-items:center;font-size:26px}
.bubble{flex:1 1 240px;min-width:0;background:var(--primary-soft);border-radius:4px var(--radius-md) var(--radius-md) var(--radius-md);padding:var(--space-2) var(--space-4)}
.bubble b{font-weight:700}
.bubble.ok{background:var(--correct);color:var(--on-primary)}
.bubble.retry{background:var(--retry);color:var(--ink)}
.bubble.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.02)}}
.fbsym{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;margin-inline-end:var(--space-2);vertical-align:-6px}
.bubble.ok .fbsym{background:var(--on-primary);color:var(--correct)}
.bubble.retry .fbsym{background:var(--ink);color:var(--retry)}
.helpbtn{flex:none;min-height:var(--touch-min);border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:16px;font-weight:600;padding:var(--space-2) var(--space-4);cursor:pointer}
.go{min-height:var(--touch-min);border:none;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font-size:18px;line-height:24px;font-weight:600;padding:var(--space-2) var(--space-6);cursor:pointer}
.go.alt{border-radius:var(--radius-md);border:2px solid var(--line);background:transparent;color:var(--ink)}
.go.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--primary-soft)}}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.progress{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.progress span{width:16px;height:16px;border-radius:50%;background:var(--hair)}
.progress span.done{background:var(--accent)}
.progress span.miss{background:var(--surface-100);border:2px solid var(--line)}
.progress span.now{outline:2px solid var(--ink);outline-offset:2px}
.small{font-size:16px;line-height:24px;color:var(--ink-muted);margin:0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-2)}
.names button{min-height:var(--answer-tile);border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:20px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.names button small{font-size:16px;font-weight:500;color:var(--ink-muted)}
.legend{background:var(--surface-100);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4)}
/* math */
.math{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:center;word-spacing:.12em}
.op{color:var(--primary);font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;direction:ltr;line-height:1;margin:0 .12em}
.frac .fn{padding:0 .2em .12em;border-bottom:.08em solid currentColor}
.frac .fd{padding:.12em .2em 0}
.vx{font-style:italic}
.tm{display:inline-block;white-space:nowrap}
.eqbox{background:var(--surface-100);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);min-height:120px;justify-content:center}
.eqmain{font-size:44px;line-height:56px;font-weight:700}
@media (max-width:480px){.eqmain{font-size:34px;line-height:46px}}
.eqmain .ln{display:flex;align-items:center;gap:var(--space-2)}
.eqmain .tag{font-size:16px;font-weight:600;color:var(--ink-muted);min-width:1.6em;text-align:center}
.slot{display:inline-grid;place-items:center;min-width:1.6em;height:1.25em;padding:0 .2em;border-radius:var(--radius-sm);background:var(--accent-soft);border:3px dashed var(--accent);color:var(--ink)}
.slot:not(#slot){opacity:.45;border-style:dotted}
.slot.filled{border-style:solid;background:var(--correct-soft);border-color:var(--correct)}
.slot.bad{background:var(--retry-soft);border-color:var(--retry);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:22px;line-height:32px;color:var(--ink-muted)}
.steps li{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.steps .how{font-size:16px;color:var(--ink-muted)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-2)}
.ops button{min-height:var(--answer-tile);border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:18px;line-height:24px;font-weight:600;cursor:pointer;padding:var(--space-2) var(--space-4)}
.ops button:hover{border-color:var(--primary)}
.ops button.retry{border-color:var(--retry);background:var(--retry-soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);max-width:360px;width:100%;align-self:center;direction:ltr}
.pad button{min-height:60px;border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:26px;font-weight:700;cursor:pointer}
.pad button.ok{grid-column:1/-1;border:none;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font-size:20px;min-height:var(--touch-min)}
.done-box{display:flex;flex-direction:column;gap:var(--space-4);align-items:center;text-align:center}
.bigstat{font-size:48px;line-height:56px;font-weight:700;font-variant-numeric:tabular-nums}
/* lesson */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.lstep{display:flex;gap:6px}
.lstep span{width:28px;height:8px;border-radius:var(--radius-pill);background:var(--hair)}
.lstep span.on{background:var(--accent)}
.ltext{min-height:7em}
.ltext .math{font-size:22px;font-weight:600;margin:4px 0}
.ltext.pop{animation:pop .4s ease-out}
.ask{border-top:2px solid var(--hair);padding-top:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.ask h3{font-size:20px;line-height:28px;font-weight:600;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chips button{min-height:var(--touch-min);border:2px solid var(--line);background:var(--surface-100);border-radius:var(--radius-md);font-size:16px;font-weight:600;padding:var(--space-2) var(--space-4);cursor:pointer}
.chat{display:flex;flex-direction:column;gap:var(--space-2)}
.msg{max-width:88%;padding:var(--space-2) var(--space-4)}
.msg.me{align-self:flex-start;background:var(--accent-soft);border-radius:var(--radius-md) 4px var(--radius-md) var(--radius-md)}
.msg.bot{align-self:flex-end;background:var(--primary-soft);border-radius:4px var(--radius-md) var(--radius-md) var(--radius-md)}
.msg.retry{background:var(--retry)}
.askrow{display:flex;gap:var(--space-2);align-items:center}
.askrow input{flex:1;min-width:0;min-height:var(--touch-min);font-family:var(--font);font-size:18px;padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--surface-100);color:var(--ink)}
.icon-btn.rec{background:var(--primary);border-color:var(--primary)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* טלפון: הרמות בשורה אחת, וכפתורי הפעולה ולוח המספרים עולים מיד מתחת למשוואה, לפני המאזניים */
@media (max-width:600px){
  .wrap{gap:var(--space-4)}
  .tracks button{min-height:56px}
  .tracks button small{display:none}
  .levels{flex-wrap:nowrap;gap:6px}
  .levels button{min-width:0;flex:1 1 0;padding:0 4px;font-size:15px;white-space:nowrap}
  #practice>.stage{order:2}
  .coach .bubble{flex:1 1 calc(100% - 56px)}
  .coach .helpbtn{margin-inline-start:56px}
  .eqbox{min-height:88px;padding:var(--space-2)}
  .eqmain{font-size:clamp(24px,7.4vw,34px);line-height:1.35}
  .ops{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .ops button{font-size:16px}
  .pad button{min-height:52px}
}
/* טאבלט לרוחב (כמו Galaxy Tab S11): ראש הדף קומפקטי, המאזניים בעמודה אחת,
   והבועה, המשוואה והכפתורים בעמודה שלידם, כדי שלא צריך לגלול בכל צעד */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px) and (max-height:900px){
  .wrap{gap:12px}
  .card{padding:var(--space-4)}
  .tracks button{min-height:52px}
  .tracks button small{display:none}
  #practice{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px 18px;align-items:start;align-content:start}
  #practice>*{grid-column:2}
  #practice>.stage{display:contents}
  #practice>.stage>canvas{grid-column:1;grid-row:1/span 9}
  #practice>.stage>.side{grid-column:2;order:5}
  #practice .eqbox{min-height:88px}
  .eqmain{font-size:38px;line-height:50px}
  .pad{gap:6px}
  .pad button{min-height:var(--touch-min);font-size:22px}
  canvas.cv{max-width:calc((100svh - 200px) * var(--ar,1.4));margin-inline:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>מאזני <span>המשוואות</span></h1>
    <div class="hud">
      <button class="helpbtn" id="userBtn" hidden>👤 <span id="userName"></span></button>
      <button class="icon-btn" id="sound" aria-label="השתקה">🔊</button>
      <div class="stars" aria-live="polite"><b id="starIcon">★</b><span id="starCount">0</span></div>
    </div>
  </header>

  <section class="card" id="who" hidden>
    <h2>מי משחק עכשיו?</h2>
    <p class="small">כל משתתף מקבל התקדמות וכוכבים משלו. ההתקדמות נשמרת במכשיר הזה.</p>
    <div class="names" id="names"></div>
    <form class="askrow" id="nameForm">
      <input id="nameIn" maxlength="16" autocomplete="off" placeholder="שם חדש">
      <button class="go" id="nameAdd">הוספה</button>
    </form>
    <p class="small" id="nameNote"></p>
  </section>
  <div id="gameNav" class="side">
  <div class="tracks" role="tablist">
    <button role="tab" id="tr1" aria-selected="true" data-tr="one">⚖️ נעלם אחד<small>רמות 1 עד 5</small></button>
    <button role="tab" id="tr2" aria-selected="false" data-tr="two">⚖️⚖️ שני נעלמים<small>רמות 1 עד 4</small></button>
  </div>
  <div class="levels" id="levels" role="tablist"></div>
  </div>

  <!-- LESSON -->
  <section class="card" id="lesson" hidden>
    <div class="lhead"><h2 id="lTitle"></h2><div class="lstep" id="lStep"></div></div>
    <div class="stage">
      <canvas class="cv" id="lCv" aria-label="הדגמה על מאזניים"></canvas>
      <div class="side">
        <div class="ltext" id="lText"></div>
        <div class="row">
          <button class="go alt" id="lPrev">→ הקודם</button>
          <button class="go" id="lNext">הבא ←</button>
        </div>
        <button class="go alt" id="lSkip">דילוג ישר לתרגול</button>
      </div>
    </div>
    <div class="ask" id="ask" hidden>
      <h3>יש לך שאלה? 🙋‍♀️ המדריכה עונה</h3>
      <div class="chips" id="chips"></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="askrow" id="askForm">
        <input id="askIn" autocomplete="off" placeholder="כתבי או אמרי את השאלה שלך...">
        <button type="button" class="icon-btn" id="mic" aria-label="שאלה בדיבור">🎤</button>
        <button class="go alt" id="askBtn">שאלה</button>
      </form>
      <p class="small" id="askNote"></p>
    </div>
  </section>

  <!-- PRACTICE -->
  <section class="card" id="practice" hidden>
    <div class="coach"><div class="avatar">👩‍🏫</div><div class="bubble" id="say"></div><button class="helpbtn" id="helpBtn">📖 הסבר ושאלות</button></div>
    <div class="row" style="justify-content:space-between"><div class="progress" id="prog"></div><span class="small" id="levelName"></span></div>
    <div class="eqbox"><div class="eqmain" id="eq"></div></div>
    <div class="stage">
      <canvas class="cv" id="bCv" aria-label="המאזניים של המשוואה"></canvas>
      <div class="side">
        <p class="small legend">🟩 קופסה היא נעלם · ⬛ משקולת היא מספר חיובי, שמושך למטה · 🎈 בלון הוא מספר שלילי, שמושך למעלה</p>
        <p class="small" id="stepsLbl" hidden>הדרך עד עכשיו</p>
        <ul class="steps" id="steps"></ul>
      </div>
    </div>
    <div id="opsWrap" class="side"><p class="small" id="opsLabel">מה עושים עכשיו לשני הצדדים?</p><div class="ops" id="ops"></div></div>
    <div class="pad" id="pad" hidden>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="-" aria-label="מינוס">−</button><button data-k="0">0</button><button data-k="del" aria-label="מחיקה">⌫</button>
      <button class="ok" data-k="ok">בדיקה</button>
    </div>
    <div class="done-box" id="doneBox" hidden></div>
  </section>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const PI2=Math.PI*2,lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MINUS='−';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);

/* ---------- fractions ---------- */
function F(n,d){d=d||1;if(d<0){n=-n;d=-d;}const g=gcd(n,d);return{n:n/g,d:d/g};}
const fz=F(0),fo=F(1);
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),fsub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d),fmul=(a,b)=>F(a.n*b.n,a.d*b.d),fdiv=(a,b)=>F(a.n*b.d,a.d*b.n);
const fint=a=>a.d===1,feq=(a,b)=>a.n===b.n&&a.d===b.d,fnum=a=>a.n/a.d,fF=x=>typeof x==='number'?F(x):x;

/* ---------- equation model ----------
   side: {t:'p',a,b}  =  a·v + b          (a,b fractions)
         {t:'g',k,a,b} = k·(a·v + b)       (k fraction, a,b ints) */

    const bl=[];['a','b','c'].forEach(f=>{if(e[f])bl.push({eq:o.key,f,value:ne[f],hint:`חשבי: ${num(e[f])} פעמים ${k}. כופלים כל איבר במשוואה.`});});
    startBlanks(bl,`כופלים כל איבר במשוואה ב־${k}. כתבי את המספרים החדשים, אחד אחרי השני.`);return;}
  let r;if(o.act==='add')r={a:E1.a+E2.a,b:E1.b+E2.b,c:E1.c+E2.c};else if(o.act==='sub12')r={a:E1.a-E2.a,b:E1.b-E2.b,c:E1.c-E2.c};else r={a:E2.a-E1.a,b:E2.b-E1.b,c:E2.c-E1.c};
  const v=r.a!==0?'x':'y',coef=r.a!==0?r.a:r.b;
  $('steps').lastChild.innerHTML+=` <span class="how">${o.act==='add'?'חיברנו את המשוואות':'חיסרנו את המשוואות'}</span>`;
  const sg=o.act==='add'?'+':MINUS,A1=o.act==='sub21'?E2:E1,A2=o.act==='sub21'?E1:E2,f=v==='x'?'a':'b';
  c.elimVar=v;c.st={L:P(coef,0),R:P(0,r.c),v};c.phase='blank';
  BB.set(c.st,{hide:{L:{a:true},R:{b:true}}});
  startBlanks([{side:'L',f:'a',value:F(coef),hint:`חשבי: ${m(`${num(A1[f])} ${opH(sg)} ${num(A2[f])}`)}`},{side:'R',f:'b',value:F(r.c),hint:`חשבי: ${m(`${num(A1.c)} ${opH(sg)} ${num(A2.c)}`)}`}],
    `${v==='x'?'y':'x'} נעלם! עכשיו חשבי את המספרים שנשארו: קודם כמה ${v} יש, ואחר כך המספר אחרי השווה.`);}
function finishTwoPart(v){const c=R.cur,o=c.orig;
  const known=c.st.v;c.solved[known]=v;
  if(Object.keys(c.solved).length===1){ // substitute into original first equation
    addStep(eqH(c.st),'');
    const other=known==='x'?'y':'x',E=o.orig.E1;const ck=known==='x'?E.a:E.b,co=known==='x'?E.b:E.a;
    let E_=E;if(co===0){E_=o.orig.E2;}
    const ck2=known==='x'?E_.a:E_.b,co2=known==='x'?E_.b:E_.a;
    c.solved.first=`${m(`<span class="vx">${known}</span> ${opH('=')} ${num(v)}`)} ✓`;
    c.st={L:P(co2,0),R:P(0,E_.c),v:other};
    // show substituted: co2·other + ck2·v = c  → child computes ck2·v
    c.st.L=P(co2,ck2*v);c.phase='blank';c.subInfo={ck:ck2,v,known};BB.set(c.st,{hide:{L:{b:true}}});
    startBlanks([{side:'L',f:'b',value:F(ck2*v),hint:`חשבי: ${ck2===1?num(v):`${num(ck2)} פעמים ${num(v)}`}.`}]);
    say(`מצאנו ש־${m(`<span class="vx">${known}</span> ${opH('=')} ${num(v)}`)}. עכשיו מציבים אותו במשוואה ${E_===o.orig.E1?'①':'②'} המקורית: ${m(`${ck2===1?'':num(ck2)}<span class="vx">${known}</span>`)} הופך ל־${ck2===1?num(v):`${num(ck2)} פעמים ${num(v)}`}. כמה זה?`);
    return;}
  addStep(eqH(c.st),'');
  const X=c.solved.x,Y=c.solved.y,E1=o.orig.E1,E2=o.orig.E2;
  $('opsWrap').hidden=true;const clean=c.errs===0;R.res.push(clean);if(clean)addStar(L.tr+L.lv);chord();burstEl($('eq'),clean?90:40);
  $('eq').innerHTML=`<div class="ln">${m(`<span class="vx">x</span> ${opH('=')} ${num(X)}`)}&nbsp;&nbsp;&nbsp;${m(`<span class="vx">y</span> ${opH('=')} ${num(Y)}`)}</div>`;
  BB.setSys(o.orig);
  say(`${clean?'בלי אף טעות! ★ ':'פתרת! '}בדיקה: במשוואה ① יוצא ${m(num(E1.a*X+E1.b*Y))} ובמשוואה ② יוצא ${m(num(E2.a*X+E2.b*Y))}, בדיוק כמו שצריך.`,'ok');
  nextBtn();}

/* =========================================================
   ASK THE GUIDE
   ========================================================= */
const chats={};
let busy=false;
function addMsg(who,t){const d=document.createElement('div');d.className='msg '+who;const sp=document.createElement('span');sp.textContent=t;d.appendChild(sp);$('chat').appendChild(d);return sp;}
function renderChat(){$('chat').innerHTML='';(chats[L.tr+L.lv]||[]).forEach(mm=>addMsg(mm.role==='user'?'me':'bot',mm.content));}
function rules(){const les=LES[L.tr][L.lv],s=les.slides[L.i];
  return `את מורה חמה וסבלנית למתמטיקה, ומדברת עם ילדה מחוננת בכיתה ד׳. הנושא: משוואות ${L.tr==='one'?'בנעלם אחד':'בשני נעלמים'}, רמה ${L.lv+1}: "${les.title}". השקף שהיא רואה: "${s.t}: ${plainText(s.x)}".
כללים: עני בעברית פשוטה, בלשון נקבה כלפיה, ב־2 עד 4 משפטים קצרים. השתמשי בדימוי המאזניים כשזה עוזר. בלי מילים באנגלית ובלי עיצוב (בלי כוכביות או רשימות), אבל מותר לכתוב משוואות עם x ו־y. בלי סימן כפל ובלי נקודתיים במשוואה: כותבים 5x, וחילוק כשבר. אם היא מבקשת פתרון של תרגיל, תני רמז לצעד הראשון ולא את התשובה. אם השאלה לא קשורה, החזירי בעדינות לנושא. בסוף אפשר להוסיף שאלה קטנה שמעוררת סקרנות.`;}
const ASK_URL='https://chem-lab-guide.uchimata99.workers.dev';
async function ask(q){q=(q||'').trim().slice(0,300);if(!q||busy)return;
  if(!navigator.onLine){$('askNote').textContent='אין אינטרנט כרגע. המדריכה צריכה חיבור כדי לענות.';return;}
  busy=true;$('askBtn').disabled=true;$('askIn').value='';$('askNote').textContent='';
  const key=L.tr+L.lv,hist=chats[key]=chats[key]||[];hist.push({role:'user',content:q});addMsg('me',q);const out=addMsg('bot','המדריכה חושבת... 🤔');
  const les=LES[L.tr][L.lv],sl=les.slides[L.i];
  try{const r=await fetch(ASK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({app:'math',topic:`משוואות ${L.tr==='one'?'בנעלם אחד':'בשני נעלמים'}, רמה ${L.lv+1}: ${les.title}`,slide:sl.t+': '+plainText(sl.x),turns:hist.slice(-8)})});
    const d=await r.json();if(!d||!d.text)throw{code:d&&d.error||'upstream'};
    out.textContent=d.text;hist.push({role:'assistant',content:d.text});}
  catch(e){hist.pop();const code=e&&e.code;out.parentNode.classList.add('retry');
    out.textContent='↩ '+(code==='limit'?'המדריכה ענתה על הרבה שאלות היום וצריכה לנוח. נסי שוב מחר!':'משהו השתבש. נסי לשאול שוב.');}
  finally{busy=false;$('askBtn').disabled=false;}}
$('askForm').addEventListener('submit',e=>{e.preventDefault();ask($('askIn').value);});
$('ask').hidden=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recOn=false;
// ההקלטה נמשכת עד 3.5 שניות של שקט אחרי הדיבור (או עד לחיצה נוספת), עם 8 שניות להתחיל לדבר ומקסימום 30 שניות.
// אם הדפדפן עוצר באמצע (קורה באנדרואיד), ממשיכים להקשיב והטקסט נשמר.
const REC_SILENCE=3500,REC_FIRST=8000,REC_MAX=30000,TIP='כדי לשאול בקול: לחצי על המיקרופון שבמקלדת של הטלפון או המחשב, ואז הגידי את השאלה.';
let recWanted=false,recText='',recTimer=null,recStart=0;
function recArm(ms){clearTimeout(recTimer);recTimer=setTimeout(recFinish,Math.min(ms,Math.max(0,REC_MAX-(Date.now()-recStart))));}
function recFinish(){if(!recWanted)return;recWanted=false;clearTimeout(recTimer);try{rec&&rec.stop();}catch(e){}
  const s=$('askIn').value.trim();if(s)ask(s);else $('askNote').textContent='לא שמעתי שאלה. נסי שוב.';}
function recStartOne(){const base=recText;rec=new SR();rec.lang='he-IL';rec.interimResults=true;rec.continuous=true;
  rec.onresult=ev=>{let fin='',mid='';for(let i=0;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else mid+=r[0].transcript;}
    recText=(base+' '+fin).trim();$('askIn').value=(recText+' '+mid).trim();recArm(REC_SILENCE);};
  rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){recWanted=false;clearTimeout(recTimer);$('askNote').textContent='המיקרופון לא זמין כאן. '+TIP;}};
  rec.onend=()=>{if(recWanted&&Date.now()-recStart<REC_MAX){try{recStartOne();return;}catch(e){}}if(recWanted)recFinish();recOn=false;$('mic').classList.remove('rec');};
  rec.start();recOn=true;$('mic').classList.add('rec');}
$('mic').onclick=()=>{if(!SR){$('askIn').focus();$('askNote').textContent=TIP;return;}
  if(recWanted){recFinish();return;}
  try{recWanted=true;recText='';recStart=Date.now();$('askIn').value='';recStartOne();recArm(REC_FIRST);
    $('askNote').textContent='אני מקשיבה... 👂 כשתסיימי, לחצי שוב על המיקרופון או פשוט חכי רגע.';}
  catch(e){recWanted=false;$('askNote').textContent=TIP;}};

/* ---------- start ---------- */
if(all.last&&all.profiles[all.last])enter(all.last);else showWho();
function loop(){if(mode==='lesson')lessonTick();else if(mode==='practice')BB.draw();fxStep();requestAnimationFrame(loop);}
loop();
window.__eqTest={R,get mode(){return mode},genOne,genTwo,options,options2,mapSides,isSolved,blankFor,evalSide,F,fnum,lin};
})();
